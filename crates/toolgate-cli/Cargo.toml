[package]
name = "toolgate-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command line entry point for toolgate"

[[bin]]
name = "toolgate"
path = "src/main.rs"

[features]
# 外部协议客户端属可选层（§19.6）：默认构建不含 HTTP 客户端。
external-protocols = [
    "toolgate-core/external-protocols",
    "toolgate-mcp/external-protocols",
]

[dependencies]
toolgate-core = { path = "../toolgate-core" }
toolgate-mcp = { path = "../toolgate-mcp" }
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
